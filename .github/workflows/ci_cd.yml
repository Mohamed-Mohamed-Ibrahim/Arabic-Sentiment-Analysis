name: Lint Python Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
  test:
    runs-on: ubuntu-latest
    needs: ruff-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Run tests
        run: |
          uv run pytest -v
      - name: Check model test accuracy (> 0.75)
        run: |
          python - <<'PY'
          import math
          from pathlib import Path

          metrics = {}
          for line in Path("data/best_run.txt").read_text().splitlines():
            key, separator, value = line.partition(":")
            if separator:
              metrics[key.strip()] = value.strip()

          raw_accuracy = metrics.get("test_accuracy")
          if raw_accuracy is None:
            raise SystemExit("data/best_run.txt has no test_accuracy metric")

          try:
            accuracy = float(raw_accuracy)
          except ValueError:
            raise SystemExit(f"Invalid test_accuracy: {raw_accuracy!r}")

          if not math.isfinite(accuracy) or accuracy <= 0.75:
            raise SystemExit(
              f"Test accuracy must be greater than 0.75; got {accuracy:.3f}"
            )

          print(f"Test accuracy {accuracy:.3f} passed the 0.75 threshold")
          PY
  build-and-push: 
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true 
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:v1