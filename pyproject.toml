[project]
name = "arabic-sentiment-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coverage>=7.16.2",
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "mlflow>=3.16.0",
    "onnxruntime>=1.23.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.28.1",
    "ruff>=0.16.10",
    "transformers>=5.19.0",
]

[tool.uv.workspace]
members = [
    "notebooks",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "F811", "I001"]
