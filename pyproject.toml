[project]
name = "arabic-sentiment-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bentoml>=1.4.39",
    "coverage>=7.16.2",
    "dvc>=3.67.1",
    "evidently>=0.5.0",
    "fastapi>=0.141.1",
    "locust>=2.46.0",
    "mlflow>=3.16.0",
    "onnx>=1.18.0",
    "onnxruntime>=1.23.2",
    "prometheus-client>=0.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "requests>=2.28.1",
    "ruff>=0.16.10",
    "transformers>=5.19.0",
] 

[dependency-groups]
train = [
    "arabert>=0.1.4",
    "dash>=4.4.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy==1.26.4",
    "onnx==1.18",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pmdarima>=2.1.1",
    "portalocker>=2.0.0",
    "scikit-learn>=1.7.2",
    "seaborn==0.9.0",
    "torch==2.3.0",
    "torchdata==0.9.0",
    "torchtext==0.18.0",
    "transformers>=5.19.0",
]

[tool.uv.workspace]
members = [
    "notebooks",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchdata = { index = "pytorch-cpu" }
torchtext = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "F811", "I001"]
