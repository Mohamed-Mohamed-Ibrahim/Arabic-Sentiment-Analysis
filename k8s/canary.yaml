apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-canary
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "25"
spec:
  ingressClassName: nginx
  rules:
  - host: mlops.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: 
          service: 
            name: mlops-canary
            port: 
              number: 8000