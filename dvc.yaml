stages:
  prepare:
    cmd: python notebooks/prepare.py
    deps:
      - data/MSA Dataset.csv
      - notebooks/prepare.py
    params:
      - prepare
    outs:
      - data/prepared

  train:
    cmd: python notebooks/train.py
    deps:
      - data/prepared
      - notebooks/train.py
    params:
      - train
    metrics:
      - metrics.json:
          cache: false
  promote:
    cmd: python notebooks/promote.py
    deps:
      - notebooks/promote.py
      - metrics.json
    outs:
      - best_run.txt:
          cache: false